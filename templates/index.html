<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
    <!-- We are importing Tailwind CSS to make the form look beautiful instantly -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Resume Builder</h1>

        <!-- This form will send data to our Python backend -->
        <form action="/" method="POST" class="space-y-4">

            <div>
                <label class="block text-gray-700 font-bold mb-2">Full Name</label>
                <input type="text" name="full_name" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Target Job Title</label>
                <input type="text" name="target_job" required placeholder="e.g. Junior Developer"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- OUR NEW TEMPLATE SELECTOR -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">Choose a Resume Style</label>
                <select name="template_choice"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="classic">The Classic (Professional & ATS Friendly)</option>
                    <option value="modern">The Modern (Creative & Bold)</option>
                </select>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300 mt-4">
                Save Details
            </button>

        </form>
    </div>

</body>

</html>
